services:
  postgres:
    image: postgres:17-alpine
    container_name: khepree-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: khepree
      POSTGRES_PASSWORD: khepree_local
      POSTGRES_DB: khepree_local
    ports:
      - "5432:5432"
    volumes:
      - khepree_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U khepree -d khepree_local"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  khepree_pg_data:
