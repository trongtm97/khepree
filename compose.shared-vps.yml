# Khepree on a shared VPS — reuses existing chapmee-caddy via chapmee_chapmee_net.
# App service names MUST be prefixed (khepree-web, not web): generic names like `web`
# become Docker DNS aliases on the shared network and collide with CHAPMEE routing.
# Does NOT publish 80/443, 5432, 6379, or app ports to the host.
#
# Usage (on VPS as deploy user):
#   cd /opt/khepree/app
#   docker compose -f compose.shared-vps.yml --env-file /etc/khepree/.env.production up -d
#
# See docs/SHARED-VPS-DEPLOYMENT.md for Caddy blocks, DNS, and health checks.

name: khepree-shared

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@khepree-postgres:5432/${POSTGRES_DB}
  REDIS_URL: redis://:${REDIS_PASSWORD}@khepree-redis:6379
  TRUSTED_PROXY: ${TRUSTED_PROXY:-none}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
  BETTER_AUTH_URL: ${BETTER_AUTH_URL}
  WEB_URL: ${WEB_URL}
  APP_URL: ${APP_URL}
  ACCOUNT_URL: ${ACCOUNT_URL}
  ADMIN_URL: ${ADMIN_URL}
  PARTNER_URL: ${PARTNER_URL}
  API_URL: ${API_URL}
  NEXT_PUBLIC_WEB_URL: ${NEXT_PUBLIC_WEB_URL}
  NEXT_PUBLIC_ACCOUNT_URL: ${NEXT_PUBLIC_ACCOUNT_URL}
  NEXT_PUBLIC_ADMIN_URL: ${NEXT_PUBLIC_ADMIN_URL}
  NEXT_PUBLIC_PARTNER_URL: ${NEXT_PUBLIC_PARTNER_URL}
  STORAGE_PROVIDER: ${STORAGE_PROVIDER:-s3}
  S3_ENDPOINT: ${S3_ENDPOINT}
  S3_REGION: ${S3_REGION:-auto}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
  S3_BUCKET_PUBLIC: ${S3_BUCKET_PUBLIC}
  S3_BUCKET_PRIVATE: ${S3_BUCKET_PRIVATE}
  S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
  S3_PUBLIC_ACCESS_MODE: ${S3_PUBLIC_ACCESS_MODE:-acl}
  LICENSE_SIGNING_PRIVATE_KEY: ${LICENSE_SIGNING_PRIVATE_KEY}
  LICENSE_SIGNING_PUBLIC_KEY: ${LICENSE_SIGNING_PUBLIC_KEY}
  EMAIL_PROVIDER: ${EMAIL_PROVIDER}
  MAIL_FROM: ${MAIL_FROM:-}
  MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
  EMAIL_FROM: ${EMAIL_FROM:-}
  EMAIL_PROVIDER_API_KEY: ${EMAIL_PROVIDER_API_KEY:-}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  PAYMENT_PROVIDER: ${PAYMENT_PROVIDER}
  SEPAY_ENV: ${SEPAY_ENV}
  SEPAY_BANK_CODE: ${SEPAY_BANK_CODE:-}
  SEPAY_BANK_ACCOUNT_NUMBER: ${SEPAY_BANK_ACCOUNT_NUMBER:-}
  SEPAY_BANK_ACCOUNT_NAME: ${SEPAY_BANK_ACCOUNT_NAME:-}
  SEPAY_WEBHOOK_SECRET: ${SEPAY_WEBHOOK_SECRET:-}
  SEPAY_API_KEY: ${SEPAY_API_KEY:-}
  SEPAY_WEBHOOK_AUTH: ${SEPAY_WEBHOOK_AUTH:-hmac_sha256}
  SEPAY_QR_BASE_URL: ${SEPAY_QR_BASE_URL:-}
  SEPAY_MERCHANT_ID: ${SEPAY_MERCHANT_ID:-}
  SEPAY_SECRET_KEY: ${SEPAY_SECRET_KEY:-}
  SEPAY_IPN_SECRET: ${SEPAY_IPN_SECRET:-}
  OUTBOX_WORKER_SECRET: ${OUTBOX_WORKER_SECRET:-}
  OUTBOX_LOCK_TIMEOUT_MS: ${OUTBOX_LOCK_TIMEOUT_MS:-300000}
  OUTBOX_MAX_ATTEMPTS: ${OUTBOX_MAX_ATTEMPTS:-12}
  OUTBOX_POLL_INTERVAL_MS: ${OUTBOX_POLL_INTERVAL_MS:-5000}
  OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-20}
  DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
  DATABASE_IDLE_TIMEOUT: ${DATABASE_IDLE_TIMEOUT:-20}
  DATABASE_CONNECT_TIMEOUT: ${DATABASE_CONNECT_TIMEOUT:-10}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  MAINTENANCE_MODE: ${MAINTENANCE_MODE:-}

x-app-depends: &app-depends
  migrate:
    condition: service_completed_successfully
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy

networks:
  khepree_internal:
    driver: bridge
  shared_proxy:
    external: true
    name: chapmee_chapmee_net

volumes:
  khepree_pg_data:
  khepree_redis_data:

services:
  postgres:
    container_name: khepree-postgres
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - khepree_pg_data:/var/lib/postgresql/data
    networks:
      - khepree_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  redis:
    container_name: khepree-redis
    image: redis:7.4.2-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - khepree_redis_data:/data
    networks:
      - khepree_internal
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  migrate:
    container_name: khepree-migrate
    image: ${KHEPREE_MIGRATE_IMAGE:-khepree-migrate:production}
    build:
      context: .
      dockerfile: docker/Dockerfile.migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@khepree-postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - khepree_internal
    restart: "no"
    logging: *default-logging

  khepree-web:
    container_name: khepree-web
    image: ${KHEPREE_WEB_IMAGE:-khepree-web:production}
    build:
      context: .
      dockerfile: docker/Dockerfile.app
      args:
        APP_NAME: web
        APP_FILTER: "@khepree/web"
        PORT: 3000
        DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@khepree-postgres:5432/${POSTGRES_DB}
        S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL}
    restart: unless-stopped
    environment:
      <<: *app-env
      PORT: 3000
      APP_NAME: web
      HOSTNAME: 0.0.0.0
    depends_on: *app-depends
    networks:
      - khepree_internal
      - shared_proxy
    expose:
      - "3000"
    stop_grace_period: 30s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M

  khepree-account:
    container_name: khepree-account
    image: ${KHEPREE_ACCOUNT_IMAGE:-khepree-account:production}
    build:
      context: .
      dockerfile: docker/Dockerfile.app
      args:
        APP_NAME: account
        APP_FILTER: "@khepree/account"
        PORT: 3001
        DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@khepree-postgres:5432/${POSTGRES_DB}
    restart: unless-stopped
    environment:
      <<: *app-env
      PORT: 3001
      APP_NAME: account
      HOSTNAME: 0.0.0.0
    depends_on: *app-depends
    networks:
      - khepree_internal
      - shared_proxy
    expose:
      - "3001"
    stop_grace_period: 30s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M

  khepree-admin:
    container_name: khepree-admin
    image: ${KHEPREE_ADMIN_IMAGE:-khepree-admin:production}
    build:
      context: .
      dockerfile: docker/Dockerfile.app
      args:
        APP_NAME: admin
        APP_FILTER: "@khepree/admin"
        PORT: 3002
        DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@khepree-postgres:5432/${POSTGRES_DB}
    restart: unless-stopped
    environment:
      <<: *app-env
      PORT: 3002
      APP_NAME: admin
      HOSTNAME: 0.0.0.0
    depends_on: *app-depends
    networks:
      - khepree_internal
      - shared_proxy
    expose:
      - "3002"
    stop_grace_period: 30s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M

  khepree-partner:
    container_name: khepree-partner
    image: ${KHEPREE_PARTNER_IMAGE:-khepree-partner:production}
    build:
      context: .
      dockerfile: docker/Dockerfile.app
      args:
        APP_NAME: partner
        APP_FILTER: "@khepree/partner"
        PORT: 3003
        DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@khepree-postgres:5432/${POSTGRES_DB}
    restart: unless-stopped
    environment:
      <<: *app-env
      PORT: 3003
      APP_NAME: partner
      HOSTNAME: 0.0.0.0
    depends_on: *app-depends
    networks:
      - khepree_internal
      - shared_proxy
    expose:
      - "3003"
    stop_grace_period: 30s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M

  khepree-api:
    container_name: khepree-api
    image: ${KHEPREE_API_IMAGE:-khepree-api:production}
    build:
      context: .
      dockerfile: docker/Dockerfile.app
      args:
        APP_NAME: api
        APP_FILTER: "@khepree/api"
        PORT: 3004
        DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@khepree-postgres:5432/${POSTGRES_DB}
    restart: unless-stopped
    environment:
      <<: *app-env
      PORT: 3004
      APP_NAME: api
      HOSTNAME: 0.0.0.0
    depends_on: *app-depends
    networks:
      - khepree_internal
      - shared_proxy
    expose:
      - "3004"
    stop_grace_period: 30s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M

  worker:
    container_name: khepree-worker
    image: ${KHEPREE_WORKER_IMAGE:-khepree-outbox-worker:production}
    build:
      context: .
      dockerfile: docker/Dockerfile.outbox-worker
    restart: unless-stopped
    environment:
      <<: *app-env
    depends_on: *app-depends
    networks:
      - khepree_internal
    stop_grace_period: 60s
    stop_signal: SIGTERM
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
