name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  integration:
    name: postgres integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: khepree
          POSTGRES_PASSWORD: khepree_local
          POSTGRES_DB: khepree_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U khepree -d khepree_local"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TURBO_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgresql://khepree:khepree_local@localhost:5432/khepree_local
      INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Migrate from empty
        run: pnpm db:migrate

      - name: Integration tests
        run: pnpm test
