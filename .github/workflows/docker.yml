name: Docker

on:
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "docker/**"
      - "tooling/**"
      - "pnpm-lock.yaml"
      - ".dockerignore"

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    name: build production images
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: khepree
          POSTGRES_PASSWORD: khepree_local
          POSTGRES_DB: khepree_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U khepree -d khepree_local"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://khepree:khepree_local@localhost:5432/khepree_local
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            filter: "@khepree/web"
            port: 3000
          - name: account
            filter: "@khepree/account"
            port: 3001
          - name: admin
            filter: "@khepree/admin"
            port: 3002
          - name: partner
            filter: "@khepree/partner"
            port: 3003
          - name: api
            filter: "@khepree/api"
            port: 3004
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Migrate for SSG build
        run: |
          pnpm install --frozen-lockfile
          pnpm db:migrate

      - name: Build image
        run: |
          docker build \
            --network host \
            -f docker/Dockerfile.app \
            --build-arg APP_NAME=${{ matrix.name }} \
            --build-arg APP_FILTER=${{ matrix.filter }} \
            --build-arg PORT=${{ matrix.port }} \
            --build-arg DATABASE_URL=${{ env.DATABASE_URL }} \
            -t khepree-${{ matrix.name }}:ci \
            .

      - name: Smoke /healthz
        run: |
          cid=$(docker run -d --rm -p ${{ matrix.port }}:${{ matrix.port }} \
            -e PORT=${{ matrix.port }} \
            -e NODE_ENV=production \
            -e DATABASE_URL=${{ env.DATABASE_URL }} \
            -e BETTER_AUTH_SECRET=ci-docker-secret-minimum-32-characters-long \
            -e BETTER_AUTH_URL=http://localhost:3001 \
            -e WEB_URL=http://localhost:3000 \
            -e ACCOUNT_URL=http://localhost:3001 \
            -e ADMIN_URL=http://localhost:3002 \
            -e PARTNER_URL=http://localhost:3003 \
            -e API_URL=http://localhost:3004 \
            -e REDIS_URL=redis://127.0.0.1:6379 \
            -e S3_ENDPOINT=https://s3.smoke.example \
            -e S3_REGION=auto \
            -e S3_ACCESS_KEY_ID=smoke \
            -e S3_SECRET_ACCESS_KEY=smoke \
            -e S3_BUCKET_PUBLIC=smoke-public \
            -e S3_BUCKET_PRIVATE=smoke-private \
            -e S3_PUBLIC_BASE_URL=https://cdn.smoke.example \
            -e LICENSE_SIGNING_PRIVATE_KEY=smoke-private-key \
            -e LICENSE_SIGNING_PUBLIC_KEY=smoke-public-key \
            -e EMAIL_FROM="Khepree <no-reply@khepree.com>" \
            -e EMAIL_PROVIDER=resend \
            -e EMAIL_PROVIDER_API_KEY=smoke-email-key \
            -e PAYMENT_PROVIDER=sepay \
            -e SEPAY_ENV=sandbox \
            -e SEPAY_MERCHANT_ID=smoke-merchant \
            -e SEPAY_SECRET_KEY=smoke-sepay-secret-key \
            khepree-${{ matrix.name }}:ci)
          for i in $(seq 1 30); do
            if curl -sf "http://127.0.0.1:${{ matrix.port }}/healthz"; then
              docker stop "$cid"
              exit 0
            fi
            sleep 2
          done
          docker logs "$cid" || true
          docker stop "$cid" || true
          exit 1

  outbox-worker:
    name: build outbox worker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build worker image
        run: docker build -f docker/Dockerfile.outbox-worker -t khepree-outbox-worker:ci .

      - name: Smoke worker entrypoint
        run: |
          out=$(docker run --rm khepree-outbox-worker:ci 2>&1) || true
          echo "$out" | grep -q "DATABASE_URL is required"
